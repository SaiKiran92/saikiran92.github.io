<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>(function(){var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);else if(window.matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.setAttribute('data-theme','dark');}());</script>
  <link rel="stylesheet" href="style.css">
  <title>Projects — Tales of the Fat Tails</title>
  <style>
    .project-entry {
      padding: 1rem 0 1rem 1rem;
      border-left: 3px solid var(--accent);
      margin-bottom: 1.4rem;
    }
    .project-entry h2 {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 0.3rem;
    }
    .project-entry h2 a { color: var(--fg); text-decoration: none; }
    .project-entry h2 a:hover { color: var(--accent); }
    .project-entry p { font-size: 0.88rem; color: var(--muted); line-height: 1.55; }
  </style>
</head>
<body>

  <nav id="nav"></nav>

  <div class="content">
    <h1>Projects</h1>
    <p style="font-size:0.88rem; color:var(--muted); font-style:italic;">To be added.</p>

    <!-- HOW TO ADD A PROJECT — copy this block:

      <p>One or two sentence description.</p>
    </div>
    -->
  </div>

  <footer>© 2026 Sai Kiran Mayakuntla</footer>

  <script defer src="main.js"></script>

</body>
</html>
