{% extends "base.html" %}

{% block title %}Projects — Tales of the Fat Tails{% endblock %}

{% block extra_style %}
  <style>
    .project-entry {
      padding: 1rem 0 1rem 1rem;
      border-left: 3px solid var(--accent);
      margin-bottom: 1.4rem;
    }
    .project-entry h2 {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 0.3rem;
    }
    .project-entry h2 a { color: var(--fg); text-decoration: none; }
    .project-entry h2 a:hover { color: var(--accent); }
    .project-entry p { font-size: 0.88rem; color: var(--muted); line-height: 1.55; }
  </style>
{% endblock %}

{% block content %}
  <div class="content">
    <h1>Projects</h1>
    <p style="font-size:0.88rem; color:var(--muted); font-style:italic;">To be added.</p>

    <!-- HOW TO ADD A PROJECT — copy this block:
    <div class="project-entry">
      <h2><a href="https://github.com/..." target="_blank">Project Name</a></h2>
      <p>One or two sentence description.</p>
    </div>
    -->
  </div>
{% endblock %}
