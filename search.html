<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>(function(){var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);else if(window.matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.setAttribute('data-theme','dark');}());</script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="stylesheet" href="style.css">
  <title>Search — Tales of the Fat Tails</title>
  <style>
    #search-input {
      width: 100%;
      padding: 0.6rem 0.8rem;
      font-size: 0.95rem;
      font-family: inherit;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--bg);
      color: var(--fg);
      outline: none;
      margin-bottom: 2rem;
    }
    #search-input:focus { border-color: var(--muted); }

    #search-results { list-style: none; }
    #search-results li { padding: 1rem 0; border-bottom: 1px solid var(--border); }

    .result-date { font-size: 0.75rem; color: var(--muted); margin-bottom: 0.2rem; }
    .result-title { font-size: 1rem; font-weight: 600; margin-bottom: 0.25rem; }
    .result-title a { color: var(--fg); text-decoration: none; }
    .result-title a:hover { text-decoration: underline; }
    .result-summary { font-size: 0.85rem; color: var(--muted); line-height: 1.5; }

    .no-results { font-size: 0.9rem; color: var(--muted); font-style: italic; padding: 1.5rem 0; }
  </style>
</head>
<body>

  <nav id="nav"></nav>

  <div class="content">
    <h1>Search</h1>
    <input id="search-input" type="search" placeholder="Search posts..." autocomplete="off" autofocus>
    <ul id="search-results"></ul>
  </div>

  <footer>© 2026 Sai Kiran Mayakuntla</footer>

  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script defer src="main.js"></script>
  <script>
    var fuse;
    var searchInput = document.getElementById('search-input');
    var resultsList = document.getElementById('search-results');

    fetch('index.json')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        fuse = new Fuse(data, {
          keys: ['title', 'summary', 'content', 'tags'],
          threshold: 0.4,
          distance: 100,
          ignoreLocation: true
        });
        var q = new URLSearchParams(window.location.search).get('q');
        if (q) { searchInput.value = q; runSearch(q); }
      });

    searchInput.addEventListener('input', function() { runSearch(this.value.trim()); });

    function runSearch(query) {
      resultsList.innerHTML = '';
      if (!query || !fuse) return;
      var results = fuse.search(query);
      if (!results.length) {
        resultsList.innerHTML = '<li class="no-results">No results for "' + escapeHtml(query) + '".</li>';
        return;
      }
      results.forEach(function(r) {
        var item = r.item;
        var li = document.createElement('li');
        li.innerHTML =
          (item.date ? '<div class="result-date">' + item.date + '</div>' : '') +
          '<div class="result-title"><a href="' + escapeHtml(item.permalink) + '">' + escapeHtml(item.title) + '</a></div>' +
          (item.summary ? '<div class="result-summary">' + escapeHtml(item.summary) + '</div>' : '');
        resultsList.appendChild(li);
      });
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  </script>

</body>
</html>
