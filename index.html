<head>
  <meta charset="UTF-8" />

  <title>Sai Kiran Mayakuntla</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #fff;
      --fg: #1a1a1a;
      --muted: #787878;
      --border: #e5e5e5;
      --tag-bg: #f5f5f5;
      --max: 760px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      font-size: 15px;
      line-height: 1.6;
    }

    nav {
      position: sticky;
      top: 0;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      z-index: 50;
    }

    .nav-inner {
      max-width: var(--max);
      margin: 0 auto;
      padding: 0 1.5rem;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-title {
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      color: var(--fg);
    }

    .nav-right {
      display: flex;
      gap: 1.5rem;
    }

    .nav-right a {
      font-size: 0.85rem;
      color: var(--muted);
      text-decoration: none;
    }
    .nav-right a:hover { color: var(--fg); }
    .nav-right a.active { color: var(--fg); font-weight: 500; }

    .profile {
      max-width: var(--max);
      margin: 0 auto;
      padding: 2.2rem 1.5rem 0;
    }

    .profile h1 {
      font-size: 1.35rem;
      font-weight: 600;
      margin-bottom: 0.2rem;
    }

    .profile .tagline {
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 0.9rem;
    }

    .social-links {
      display: flex;
      gap: 1rem;
      font-size: 0.82rem;
    }

    .social-links a {
      color: var(--muted);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.28rem;
    }
    .social-links a:hover { color: var(--fg); }

    .social-links svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .profile-rule {
      max-width: var(--max);
      margin: 1.5rem auto 0;
      border: none;
      border-top: 1px solid var(--border);
    }

    .posts {
      max-width: var(--max);
      margin: 0 auto;
      padding: 0 1.5rem 4rem;
    }

    .empty-state {
      padding: 3rem 0;
      color: var(--muted);
      font-size: 0.9rem;
      font-style: italic;
    }

    /* HOW TO ADD A POST — copy this block and paste at the top of .posts:
    <article class="post-entry">
      <div class="post-meta">MMM YYYY</div>
      <h2><a href="your-post-filename.html">Post title here</a></h2>
      <p>One or two sentence summary.</p>
      <div class="tags">
        <span class="tag">tag one</span>
        <span class="tag">tag two</span>
      </div>
    </article>
    */

    .post-entry {
      padding: 1.5rem 0;
      border-bottom: 1px solid var(--border);
    }

    .post-meta {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 0.3rem;
    }

    .post-entry h2 {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
      line-height: 1.35;
    }

    .post-entry h2 a {
      color: var(--fg);
      text-decoration: none;
    }
    .post-entry h2 a:hover { text-decoration: underline; }

    .post-entry p {
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 0.6rem;
      line-height: 1.55;
    }

    .tags { display: flex; flex-wrap: wrap; gap: 0.35rem; }

    .tag {
      font-size: 0.72rem;
      background: var(--tag-bg);
      color: var(--muted);
      padding: 0.15rem 0.55rem;
      border-radius: 3px;
    }

    footer {
      border-top: 1px solid var(--border);
      text-align: center;
      padding: 1.5rem;
      font-size: 0.78rem;
      color: var(--muted);
    }
  </style>
</head>
