search_content: "The optimal strategy for each robot is a threshold t: wait below t, jump from any position above t. The probability of scoring zero starting from position x given threshold t satisfies a recursive integral equation, which solves to z(x|t) = 1 - (1-t)e^(t-x). The overall probability of scoring zero is m(t) = 1 - (1-t)e^t. A non-zero score is J+U where J~Uniform[t,1] and U~Uniform[0,1], giving a trapezoidal distribution. Assuming a Nash equilibrium where both robots use the same threshold and the robot is indifferent between Jump and Wait at t, we derive the equation (t^3 - 3t + 2)e^t = 3t. Solving numerically gives t approximately 0.416195355, and the probability of scoring zero is approximately 0.114845886."
