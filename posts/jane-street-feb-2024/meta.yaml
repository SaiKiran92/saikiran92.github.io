search_content: "A circle is defined by two uniformly random points inside a unit square as its diameter. We find the probability that the circle extends outside the square. The key insight is a simplified problem: given a point P at distance x from a line and a diameter angle theta, the critical diameter for tangency is s = 2x/(1+sin(theta)). Extending to a square, the critical diameter is the minimum over all four sides. The probability is 1 minus a four-dimensional integral, which by symmetry reduces to a simpler form. After a variable substitution, the integral evaluates exactly to 1 - pi/6."
