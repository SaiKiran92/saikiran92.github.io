search_content: "This post derives the Black-Scholes formula for a European call option in three steps using the risk-neutral pricing framework. Starting from a geometric Brownian motion for the stock price, we apply Girsanov's theorem to change to the risk-neutral measure, use Itô's lemma to find the log-normal distribution of the stock price, and compute the resulting expectation explicitly via a Gaussian integral. The derivation highlights the two key results from stochastic calculus — Girsanov's theorem and Itô's lemma — and shows how the same approach extends to other derivative payoffs."