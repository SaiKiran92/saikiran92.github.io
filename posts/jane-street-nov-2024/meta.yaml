search_content: "The required probability is obtained by solving a quadruple integral over the unit square. Using the rotational and reflection symmetry of the square, the integral simplifies to an 8x factor over one-eighth of the domain. The inner integrals are solved analytically by deriving the upper and lower bounds U(x,y,a) and L(x,y,a) of the valid b range for a given blue point (x,y) and red point x-coordinate a. The conditional probability for a given (x,y) is analytically expressed in terms of arcsin. Numerical integration over the reduced domain yields 0.06142594735478852, and scaling by 8 gives the final answer 0.49140757883830816."
